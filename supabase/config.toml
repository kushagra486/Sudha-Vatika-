# Supabase CLI config for local development (`supabase start`).
# Only settings that differ from CLI defaults are listed.
project_id = "banquet-manager"

[api]
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
# Staff are invited by an owner; the login page never creates accounts.
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
file_size_limit = "16MiB"
