# Netlify build for the web app. Env vars (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
# VITE_APP_NAME) are set in the Netlify UI, not here: this file is committed.
[build]
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# SPA routing is handled by apps/web/public/_redirects.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
