# Publishes the public website (the site/ folder) to GitHub Pages.
# Every push to main that changes site/ copies it to the gh-pages branch, which
# GitHub Pages serves at https://kushagra486.github.io/Sudha-Vatika-/
# One-time setup: repo Settings -> Pages -> Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root).
name: Publish website

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the published folder
        run: |
          mkdir -p out
          rsync -a --exclude tools --exclude README.md --exclude netlify.toml site/ out/
          touch out/.nojekyll
          cp out/index.html out/404.html
      - name: Push to gh-pages
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish website from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
